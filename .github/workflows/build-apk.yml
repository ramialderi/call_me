name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: mkdir -p www && cp index.html config.js www/
      - run: npx cap add android
      - name: Add Firebase config if present
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/; else echo "no google-services.json"; fi
      - name: Add permissions and sync
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Verify camera and mic permissions are in the manifest
        run: |
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          echo "permissions ok"
      - name: Use fixed signing key if provided
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; else echo "no fixed keystore"; fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish public download (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ramchat.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ramchat.apk --title "دردشة الأصدقاء" --notes "أحدث نسخة من التطبيق" --latest
