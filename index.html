<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دردشة الأصدقاء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef0;--ink:#132229;--card:#fff;--me:#0f6b64;--meink:#fff;--mute:#6b7c84;--line:#d3dde1;--red:#c43d3d}
@media (prefers-color-scheme:dark){:root{--bg:#10191d;--ink:#e6eef0;--card:#1b282e;--me:#14857c;--line:#2a3a41;--mute:#8da0a8}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--me);outline-offset:2px}
#join,#rooms{max-width:360px;margin:0 auto;padding:12vh 20px 0;display:flex;flex-direction:column;gap:12px}
#join h1,#rooms h1{font-size:28px;margin:0 0 4px}
#join p,#rooms p{margin:0 0 8px;color:var(--mute)}
.f{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.go{background:var(--me);color:var(--meink);padding:14px;font-weight:700}
#app{display:none;height:100%;flex-direction:column;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header b{flex:1}
header small{color:var(--mute);font-weight:400;margin-inline-start:6px}
.ic{width:44px;height:44px;background:var(--me);color:#fff;font-size:20px}
#list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.r{display:flex;gap:8px;align-items:flex-end;align-self:flex-end;max-width:85%}
.r.me{align-self:flex-start}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.m{padding:8px 12px;border-radius:14px;background:var(--card);overflow-wrap:anywhere;min-width:0}
.m img{max-width:100%;max-height:260px;border-radius:10px;display:block}
.m.me{background:var(--me);color:var(--meink)}
.m .n{font-size:12px;color:var(--mute);font-weight:700}
.m .t{font-size:11px;opacity:.65;margin-top:2px}
.m audio{height:36px;max-width:100%}
#bar{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid var(--line)}
#txt{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
#mic.rec{background:var(--red);animation:p 1s infinite}
@keyframes p{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#mic.rec{animation:none}}
#call{position:fixed;inset:0;background:rgba(10,20,24,.94);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9}
#call h2{margin:0;font-size:26px}
#cstat{text-align:center;padding:0 20px}
#call .row{display:flex;gap:18px;margin-top:18px}
#call .row button{width:64px;height:64px;border-radius:50%;font-size:26px;color:#fff;background:#37474f}
#call .ok{background:#1f9d55!important}#call .no{background:var(--red)!important}
#dlg{position:fixed;inset:0;background:rgba(10,20,24,.7);display:none;align-items:center;justify-content:center;z-index:11;padding:20px}
#dlg .box{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px}
#dlg code{display:block;direction:ltr;text-align:center;font-size:20px;font-weight:700;padding:10px;border-radius:10px;background:var(--bg);user-select:all}
#dlg button{padding:12px}
#call{overflow:auto}
#tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;width:92%;max-width:640px}
.tile{position:relative;aspect-ratio:3/4;background:#1d2b31;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.tile .tl{font-size:38px;font-weight:700;color:#fff}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .tn{position:absolute;bottom:6px;inset-inline:8px;font-size:12px;text-shadow:0 1px 3px #000}
.q{border-inline-start:3px solid var(--mute);padding:2px 8px;margin-bottom:4px;font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.tk{margin-inline-start:4px;letter-spacing:-2px}
.tk.all{color:#7fd7ff}
.rx{display:flex;gap:4px;flex-wrap:wrap}.rx:empty{display:none}
.rx span{background:rgba(127,127,127,.22);border-radius:10px;padding:0 6px;font-size:13px;margin-top:3px}
#rbar{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
#rbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rbar button{background:none;font-size:18px}
#sheet{position:fixed;inset:0;background:rgba(10,20,24,.6);display:none;align-items:flex-end;justify-content:center;z-index:11}
#sheet .box{background:var(--card);width:100%;max-width:720px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#emo{display:flex;justify-content:space-around}
#emo button{background:none;font-size:30px;padding:6px}
#note{position:fixed;top:12px;inset-inline:12px;margin:auto;max-width:420px;background:var(--red);color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:10}
</style>
</head>
<body>
<div id="note" role="alert"></div>

<form id="join" onsubmit="return false">
  <h1>دردشة الأصدقاء</h1>
  <p>سجّل دخولك لتدخل غرفك.</p>
  <input class="f" id="name" placeholder="اسمك (للحساب الجديد فقط)" maxlength="20" autocomplete="nickname">
  <input class="f" id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" dir="ltr">
  <input class="f" id="pass" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr">
  <button class="go" id="login">دخول</button>
  <button class="f" id="signup">إنشاء حساب جديد</button>
</form>

<div id="rooms" style="display:none">
  <h1>غرفك</h1>
  <div id="mine"></div>
  <p>إنشاء غرفة جديدة</p>
  <input class="f" id="newRoom" placeholder="اسم الغرفة (إنجليزي وأرقام)" maxlength="40" autocapitalize="none" dir="ltr">
  <button class="go" id="mk">إنشاء</button>
  <p>الانضمام بدعوة</p>
  <input class="f" id="jRoom" placeholder="اسم الغرفة" autocapitalize="none" dir="ltr">
  <input class="f" id="jInv" placeholder="رمز الدعوة" autocapitalize="none" dir="ltr">
  <button class="f" id="jn">انضمام</button>
  <button class="f" id="out2">تسجيل الخروج</button>
</div>

<div id="app">
  <header>
    <b id="title"></b>
    <button class="ic" id="callBtn" title="اتصال صوتي" aria-label="اتصال صوتي">📞</button>
    <button class="ic" id="vidBtn" title="مكالمة فيديو" aria-label="مكالمة فيديو">📹</button>
    <button class="ic" id="inv" title="دعوة صديق" aria-label="دعوة صديق" style="background:var(--mute)">🔗</button>
    <button class="ic" id="back" title="غرفي" aria-label="العودة إلى الغرف" style="background:var(--mute)">☰</button>
  </header>
  <div id="list"></div>
  <div id="typing" aria-live="polite" style="padding:0 14px;min-height:18px;font-size:12px;color:var(--mute)"></div>
  <div id="rbar"><span id="rtxt"></span><button id="rx0" aria-label="إلغاء الرد">✕</button></div>
  <div id="bar">
    <button class="ic" id="attach" title="إرفاق صورة أو ملف" aria-label="إرفاق صورة أو ملف">📎</button>
    <input type="file" id="fi" hidden>
    <button class="ic" id="mic" title="تسجيل رسالة صوتية" aria-label="تسجيل رسالة صوتية">🎙️</button>
    <input id="txt" placeholder="اكتب رسالة" autocomplete="off">
    <button class="ic" id="send" aria-label="إرسال">➤</button>
  </div>
</div>

<div id="sheet" role="dialog" aria-modal="true">
  <div class="box">
    <div id="emo"></div>
    <button class="f" id="shReply">↩ رد على الرسالة</button>
    <button class="f" id="shDel">🗑 حذف رسالتي</button>
    <button class="f" id="shClose">إغلاق</button>
  </div>
</div>

<div id="dlg" role="dialog" aria-modal="true">
  <div class="box">
    <b>دعوة للغرفة</b>
    <div>اسم الغرفة</div><code id="dRoom"></code>
    <div>رمز الدعوة</div><code id="dInv"></code>
    <button class="go" id="dCopy">نسخ</button>
    <button class="f" id="dShare">مشاركة</button>
    <button class="f" id="dClose">إغلاق</button>
  </div>
</div>

<div id="call">
  <h2 id="cname"></h2>
  <div id="cstat"></div>
  <div id="dbg" dir="ltr" style="font:12px monospace;opacity:.7;max-width:90%;text-align:center"></div>
  <div id="tiles"></div>
  <div class="row">
    <button id="cmute" title="كتم المايكروفون" aria-label="كتم">🎤</button>
    <button id="ccam" title="تشغيل أو إيقاف الكاميرا" aria-label="الكاميرا">🚫</button>
    <button id="cacc" class="ok" title="رد صوتي" aria-label="رد صوتي">📞</button>
    <button id="cvac" class="ok" title="رد بالفيديو" aria-label="رد بالفيديو">📹</button>
    <button id="cend" class="no" title="إنهاء" aria-label="إنهاء">✖</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* بيانات Supabase وMetered موجودة في الملف config.js (بجانب هذا الملف) */
let ICE = [{urls:"stun:stun.l.google.com:19302"}];
let iceNote = "";
async function loadIce(){
  if(METERED_APP.includes("YOUR-")){ iceNote="not-configured"; return; }
  try{
    const res = await fetch("https://"+METERED_APP+".metered.live/api/v1/turn/credentials?apiKey="+METERED_KEY);
    const l = await res.json();
    if(Array.isArray(l) && l.length){ ICE = l; iceNote = ""; } else iceNote = "metered:" + JSON.stringify(l).slice(0,60);
  }catch(e){ iceNote = "metered-fetch-failed"; }
}
/* ================================================== */

const $ = id => document.getElementById(id);
const store = (k,v) => { try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){} };
let sb, uid, room, name, sig, live = false, pushOn = false, seen = new Set();

function note(t){ const n=$("note"); n.textContent=t; n.style.display="block"; setTimeout(()=>n.style.display="none",4500); }

/* ---------- تسجيل الدخول ---------- */
const unset = () => SUPABASE_URL.includes("YOUR-PROJECT");
const client = () => sb = sb || supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function auth(signup){
  const email=$("email").value.trim(), pass=$("pass").value, n=$("name").value.trim();
  if(!email || !pass) return note("اكتب البريد وكلمة المرور");
  if(signup && !n) return note("اكتب اسمك للحساب الجديد");
  if(unset()) return note("أضف بيانات Supabase داخل config.js");
  askNotify();
  const res = signup ? await client().auth.signUp({email,password:pass,options:{data:{name:n}}})
                     : await client().auth.signInWithPassword({email,password:pass});
  if(res.error) return note(res.error.message);
  if(!res.data.session) return note("افتح بريدك لتأكيد الحساب، ثم سجّل الدخول");
  start(res.data.session.user);
}
function start(user){
  uid = user.id; name = (user.user_metadata && user.user_metadata.name) || user.email.split("@")[0];
  const last = store("room");
  if(last) enter(last); else showRooms();
}
async function showRooms(){
  $("join").style.display="none"; $("app").style.display="none"; $("rooms").style.display="flex";
  const {data,error} = await sb.from("room_members").select("room").eq("uid",uid);
  const box = $("mine"); box.textContent = "";
  if(error) return note(error.message);
  if(!data.length){ box.textContent = "ما عندك غرف بعد. أنشئ غرفة أو انضم بدعوة."; return; }
  data.forEach(x => {
    const b = document.createElement("button"); b.className = "f";
    b.style.cssText = "display:block;width:100%;margin-bottom:8px;text-align:start";
    b.textContent = "💬 " + x.room; b.onclick = () => enter(x.room); box.appendChild(b);
  });
}
async function enter(r){
  const {data} = await sb.from("rooms").select("id").eq("id",r).maybeSingle();
  if(!data){ store("room",""); note("لم تعد عضواً في هذه الغرفة"); return showRooms(); }
  room = r; store("room", r);
  $("join").style.display="none"; $("rooms").style.display="none"; $("app").style.display="flex";
  $("title").textContent = "غرفة: " + room;
  loadMessages(); listen(); startSignal(); registerPush();
}
let inviteText = "";
function shareInvite(id, inv){
  inviteText = "انضم إلى غرفتي في تطبيق الدردشة\nالغرفة: " + id + "\nرمز الدعوة: " + inv;
  $("dRoom").textContent = id; $("dInv").textContent = inv; $("dlg").style.display = "flex";
}
$("dCopy").onclick = async () => {
  try{ await navigator.clipboard.writeText(inviteText); }
  catch(e){ const t = document.createElement("textarea"); t.value = inviteText; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); }catch(_){} t.remove(); }
  $("dCopy").textContent = "تم النسخ ✓"; setTimeout(() => $("dCopy").textContent = "نسخ", 2000);
};
$("dShare").onclick = () => { if(navigator.share) navigator.share({text:inviteText}).catch(()=>{}); else $("dCopy").click(); };
$("dClose").onclick = () => $("dlg").style.display = "none";
$("mk").onclick = async () => {
  const id = $("newRoom").value.trim().toLowerCase();
  if(!/^[a-z0-9_-]{3,40}$/.test(id)) return note("اسم الغرفة: حروف إنجليزية صغيرة وأرقام و - _ فقط (3 إلى 40)");
  const {data,error} = await sb.rpc("create_room",{p_id:id});
  if(error) return note(/duplicate|exists/i.test(error.message) ? "اسم الغرفة مستخدم، اختر اسماً آخر" : error.message);
  shareInvite(id, data); enter(id);
};
$("jn").onclick = async () => {
  const id = $("jRoom").value.trim().toLowerCase(), inv = $("jInv").value.trim();
  if(!id || !inv) return note("اكتب اسم الغرفة ورمز الدعوة");
  const {error} = await sb.rpc("join_room",{p_id:id,p_invite:inv});
  if(error) return note("اسم الغرفة أو رمز الدعوة غير صحيح");
  enter(id);
};
$("inv").onclick = async () => {
  const {data} = await sb.from("rooms").select("invite").eq("id",room).maybeSingle();
  if(data) shareInvite(room, data.invite);
};
$("back").onclick = () => { store("room",""); location.reload(); };
$("login").onclick = () => auth(false);
$("signup").onclick = () => auth(true);
$("out2").onclick = async () => { store("room",""); await client().auth.signOut(); location.reload(); };
(async () => {  /* استعادة الجلسة تلقائياً */
  if(unset()) return;
  const {data} = await client().auth.getSession();
  if(data.session) start(data.session.user);
})();

/* ---------- الإشعارات ---------- */
const LN = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
function askNotify(){
  try{ if(LN()) LN().requestPermissions(); else if(window.Notification && Notification.permission==="default") Notification.requestPermission(); }catch(e){}
}
async function notify(title, body){
  if(!document.hidden || pushOn) return;
  try{
    if(LN()) await LN().schedule({notifications:[{id:Date.now()%2147483000,title,body}]});
    else if(window.Notification && Notification.permission==="granted"){ new Notification(title,{body}); if(navigator.vibrate) navigator.vibrate(200); }
  }catch(e){}
}

/* ---------- إشعارات التطبيق المغلق (Firebase) ---------- */
async function registerPush(){
  const PN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
  if(!PN) return;
  try{
    let p = await PN.checkPermissions(); if(p.receive !== "granted") p = await PN.requestPermissions();
    if(p.receive !== "granted") return;
    PN.addListener("registration", async t => {
      const {error} = await sb.from("device_tokens").upsert({token:t.value, uid, room, updated_at:new Date().toISOString()});
      if(!error) pushOn = true;
    });
    await PN.register();
  }catch(e){}
}

/* ---------- الرسائل ---------- */
const sCache = {};
async function signed(b){
  const path = b.startsWith("http") ? decodeURIComponent((b.split("/chat-files/")[1] || "").split("?")[0]) : b;
  if(!path) return null;
  if(sCache[path]) return sCache[path];
  const {data} = await sb.storage.from("chat-files").createSignedUrl(path, 3600);
  return data ? (sCache[path] = data.signedUrl) : null;
}
const hue = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return h; };
const msgs = {}, els = {}, reacts = {}, rxEl = {}, tkEl = {}, readBy = {};
let myLast = 0, others = 0, rdT;
function setTick(id){
  const el = tkEl[id]; if(!el) return;
  const n = Object.values(readBy).filter(v => v >= id).length;
  el.textContent = n === 0 ? " ✓" : (others > 1 && n < others ? " ✓✓ " + n : " ✓✓");
  el.className = "tk" + (others > 0 && n >= others ? " all" : "");
}
function refreshTicks(){ Object.keys(tkEl).forEach(setTick); }
async function loadReads(){
  const [m, rd] = await Promise.all([
    sb.from("room_members").select("uid").eq("room",room),
    sb.from("reads").select("uid,last_id").eq("room",room)]);
  others = Math.max(0, (m.data || []).length - 1);
  (rd.data || []).forEach(x => { if(x.uid === uid) myLast = x.last_id; else readBy[x.uid] = x.last_id; });
  refreshTicks();
}
function markRead(){
  if(!room || !live || document.hidden) return;
  clearTimeout(rdT);
  rdT = setTimeout(async () => {
    const top = Math.max(0, ...Object.keys(msgs).map(Number));
    if(top > myLast){ myLast = top; await sb.from("reads").upsert({room, uid, last_id: top}); }
  }, 700);
}
document.addEventListener("visibilitychange", () => { if(!document.hidden) markRead(); });
window.addEventListener("focus", markRead);
let replyTo = null, cur = null, lastTy = 0, tyT;
const snip = m => !m ? "رسالة" : ({audio:"🎙️ رسالة صوتية",image:"📷 صورة",file:"📄 ملف",call:"📞 يتصل بك"})[m.kind] || String(m.body).slice(0,60);
function drawReacts(id){
  const rx = rxEl[id]; if(!rx) return; rx.textContent = "";
  const c = {}; Object.values(reacts[id] || {}).forEach(e => { if(e) c[e] = (c[e]||0) + 1; });
  Object.entries(c).forEach(([e,n]) => { const s = document.createElement("span"); s.textContent = e + (n>1 ? " "+n : ""); rx.appendChild(s); });
}
function fill(d, m){
  d.textContent = "";
  if(m.uid!==uid){ const n=document.createElement("div"); n.className="n"; n.textContent=m.name; d.appendChild(n); }
  if(m.deleted){ const s=document.createElement("div"); s.style.opacity=.6; s.textContent="🚫 تم حذف هذه الرسالة"; d.appendChild(s); }
  else {
    if(m.reply_to){ const q=document.createElement("div"); q.className="q"; const o=msgs[m.reply_to]; q.textContent=(o ? o.name + ": " : "") + snip(o); d.appendChild(q); }
    if(m.kind==="audio"){ const a=document.createElement("audio"); a.controls=true; a.src=m.body; d.appendChild(a); }
    else if(m.kind==="image"){ const a=document.createElement("a"); a.target="_blank"; a.rel="noopener"; const i=document.createElement("img"); i.loading="lazy"; i.alt="صورة"; a.appendChild(i); d.appendChild(a); signed(m.body).then(u => { if(u){ a.href=u; i.src=u; } }); }
    else if(m.kind==="file"){ const [u,n]=m.body.split("\n"); const a=document.createElement("a"); a.target="_blank"; a.rel="noopener"; a.style.color="inherit"; a.textContent="📄 "+(n||"ملف"); d.appendChild(a); signed(u).then(x => { if(x) a.href=x; }); }
    else if(m.kind==="call"){ const s=document.createElement("div"); const vid = m.body==="video"; s.textContent = (vid?"📹 ":"📞 ") + (m.uid===uid ? "بدأت" : m.name + " بدأ") + (vid ? " مكالمة فيديو" : " مكالمة"); d.appendChild(s); }
    else { const s=document.createElement("div"); s.textContent=m.body; d.appendChild(s); }
  }
  const t=document.createElement("div"); t.className="t";
  t.textContent = new Date(m.created_at).toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});
  if(m.uid===uid && !m.deleted){ const k=document.createElement("span"); k.className="tk"; t.appendChild(k); tkEl[m.id]=k; setTick(m.id); } else delete tkEl[m.id];
  d.appendChild(t);
  const rx = rxEl[m.id] || (rxEl[m.id] = document.createElement("div")); rx.className = "rx"; d.appendChild(rx); drawReacts(m.id);
  d.onclick = e => { if(m.deleted || m.kind==="call" || e.target.closest("a,audio")) return; openSheet(m); };
}
function add(m){
  if(seen.has(m.id)) return; seen.add(m.id); msgs[m.id] = m;
  if(live && m.uid!==uid && !m.deleted) notify(m.name, snip(m));
  if(live && m.uid!==uid) markRead();
  const d = document.createElement("div"); d.className = "m" + (m.uid===uid ? " me" : ""); els[m.id] = d;
  fill(d, m);
  const l=$("list"), near = l.scrollHeight-l.scrollTop-l.clientHeight < 120 || m.uid===uid;
  const w=document.createElement("div"); w.className="r"+(m.uid===uid?" me":"");
  if(m.uid!==uid){ const a=document.createElement("div"); a.className="av"; a.textContent=[...m.name][0]||"?"; a.style.background="hsl("+hue(m.name)+" 45% 38%)"; w.appendChild(a); }
  w.appendChild(d); l.appendChild(w); if(near) l.scrollTop = l.scrollHeight;
}
function openSheet(m){
  cur = m; const e = $("emo"); e.textContent = "";
  ["👍","❤️","😂","😮","😢","🙏"].forEach(x => {
    const b = document.createElement("button"); b.textContent = x; b.setAttribute("aria-label","تفاعل " + x);
    b.onclick = () => { react(m, x); closeSheet(); }; e.appendChild(b);
  });
  $("shDel").style.display = m.uid===uid ? "block" : "none";
  $("sheet").style.display = "flex";
}
const closeSheet = () => { $("sheet").style.display = "none"; };
async function react(m, x){
  const mine = (reacts[m.id] || {})[uid];
  const {error} = await sb.from("reactions").upsert({msg_id:m.id, room, uid, emoji: mine===x ? "" : x});
  if(error) note("تعذّر التفاعل: " + error.message);
}
function clearReply(){ replyTo = null; $("rbar").style.display = "none"; }
$("shClose").onclick = closeSheet;
$("shReply").onclick = () => {
  replyTo = {id:cur.id}; $("rtxt").textContent = "رد على " + cur.name + ": " + snip(cur);
  $("rbar").style.display = "flex"; closeSheet(); $("txt").focus();
};
$("shDel").onclick = async () => {
  const {error} = await sb.from("messages").update({deleted:true}).eq("id",cur.id); closeSheet();
  if(error) note("تعذّر الحذف: " + error.message);
};
$("rx0").onclick = clearReply;
function showTyping(n){
  $("typing").textContent = n + " يكتب…"; clearTimeout(tyT); tyT = setTimeout(() => $("typing").textContent = "", 3000);
}
async function loadMessages(){
  const {data,error} = await sb.from("messages").select("*").eq("room",room).order("id",{ascending:false}).limit(80);
  if(error) return note("تعذّر تحميل الرسائل: " + error.message);
  data.reverse().forEach(add); live = true;
  if(data.length){
    const {data:rs} = await sb.from("reactions").select("msg_id,uid,emoji").eq("room",room).gte("msg_id",data[0].id);
    (rs || []).forEach(x => { (reacts[x.msg_id] = reacts[x.msg_id] || {})[x.uid] = x.emoji; drawReacts(x.msg_id); });
  }
  await loadReads(); markRead();
}
function listen(){
  const f = {schema:"public", filter:"room=eq."+room};
  sb.channel("msgs-"+room)
    .on("postgres_changes",{event:"INSERT",table:"messages",...f}, p => add(p.new))
    .on("postgres_changes",{event:"UPDATE",table:"messages",...f}, p => { const m = p.new; msgs[m.id] = m; if(els[m.id]) fill(els[m.id], m); })
    .subscribe();
  sb.channel("rx-"+room)
    .on("postgres_changes",{event:"*",table:"reactions",...f}, p => {
      const x = p.new; if(!x || !x.msg_id) return;
      (reacts[x.msg_id] = reacts[x.msg_id] || {})[x.uid] = x.emoji; drawReacts(x.msg_id);
    })
    .subscribe();
  sb.channel("rd-"+room)
    .on("postgres_changes",{event:"*",table:"reads",...f}, p => {
      const x = p.new; if(!x || !x.uid || x.uid === uid) return;
      readBy[x.uid] = x.last_id; refreshTicks();
    })
    .subscribe();
}
async function post(kind, body){
  const row = {room, uid, name, kind, body};
  if(replyTo && kind !== "call"){ row.reply_to = replyTo.id; clearReply(); }
  const {error} = await sb.from("messages").insert(row);
  if(error) note("لم تُرسل الرسالة: " + error.message);
}
function sendText(){ const v=$("txt").value.trim(); if(!v) return; $("txt").value=""; post("text",v); }
$("send").onclick = sendText;
$("txt").onkeydown = e => { if(e.key==="Enter") sendText(); };
$("txt").oninput = () => {
  if(sig && Date.now() - lastTy > 2500){ lastTy = Date.now(); sig.send({type:"broadcast",event:"typing",payload:{name}}); }
};

/* ---------- الرسائل الصوتية ---------- */
let rec, chunks, recTimer;
$("mic").onclick = async () => {
  if(rec && rec.state==="recording"){ rec.stop(); return; }
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    rec = new MediaRecorder(st); chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      clearTimeout(recTimer); st.getTracks().forEach(t=>t.stop()); $("mic").classList.remove("rec");
      const blob = new Blob(chunks,{type:rec.mimeType}); if(blob.size<1500) return;
      const fr = new FileReader(); fr.onload = () => post("audio", fr.result); fr.readAsDataURL(blob);
    };
    rec.start(); $("mic").classList.add("rec");
    recTimer = setTimeout(()=>rec.state==="recording"&&rec.stop(), 45000);
  }catch(e){ note("اسمح للمتصفح باستخدام المايكروفون"); }
};

/* ---------- الصور والملفات ---------- */
$("attach").onclick = () => $("fi").click();
async function shrink(f){
  try{
    const b = await createImageBitmap(f), k = Math.min(1, 1280/Math.max(b.width,b.height));
    const c = document.createElement("canvas"); c.width = Math.round(b.width*k); c.height = Math.round(b.height*k);
    c.getContext("2d").drawImage(b,0,0,c.width,c.height);
    return await new Promise(res => c.toBlob(res,"image/jpeg",0.8));
  }catch(e){ return f; }
}
$("fi").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  if(f.size > 10*1024*1024) return note("الحد الأقصى للملف 10 ميجا");
  const img = f.type.startsWith("image/"), blob = img ? await shrink(f) : f;
  const ext = img ? "jpg" : ((f.name.split(".").pop() || "bin").replace(/[^a-z0-9]/gi,"").slice(0,8) || "bin");
  const path = room.replace(/[^a-z0-9_-]/g,"_") + "/" + Date.now() + "-" + Math.random().toString(36).slice(2,8) + "." + ext;
  const {error} = await sb.storage.from("chat-files").upload(path, blob, {contentType: blob.type || f.type});
  if(error) return note("فشل الرفع: " + error.message);
  post(img ? "image" : "file", img ? path : path + "\n" + f.name.slice(0,60));
};

/* ---------- المكالمات الجماعية صوت وفيديو (WebRTC) ---------- */
let local = null, inCall = false, ringing = null, muted = false;
const peers = {};   /* uid -> {pc, name, queue, stream} */
const gum = c => navigator.mediaDevices.getUserMedia(c);
const vTrack = () => local && local.getVideoTracks()[0];
const VCON = {facingMode:"user", width:{ideal:640}, height:{ideal:480}};
function sendSig(o){ sig.send({type:"broadcast",event:"sig",payload:{...o,from:uid,name}}); }
function startSignal(){
  sig = sb.channel("call-"+room,{config:{private:true,broadcast:{self:false}}});
  sig.on("broadcast",{event:"sig"},({payload}) => onSig(payload).catch(()=>{}))
     .on("broadcast",{event:"typing"},({payload}) => showTyping(payload.name))
     .subscribe();
}
function show(acc){
  $("call").style.display = "flex";
  ["cacc","cvac"].forEach(i => $(i).style.display = acc ? "block" : "none");
  ["cmute","ccam"].forEach(i => $(i).style.display = acc ? "none" : "block");
  $("tiles").style.display = acc ? "none" : "grid";
}
function tile(id, label){
  let t = document.getElementById("t-"+id);
  if(!t){
    t = document.createElement("div"); t.className = "tile"; t.id = "t-"+id;
    const l = document.createElement("div"); l.className = "tl"; l.textContent = [...label][0] || "?";
    const v = document.createElement("video"); v.autoplay = true; v.setAttribute("playsinline",""); v.style.opacity = 0;
    const n = document.createElement("div"); n.className = "tn"; n.textContent = label;
    t.append(l, v, n); $("tiles").appendChild(t);
  }
  return t.querySelector("video");
}
function setSelf(){
  const v = document.querySelector("#t-me video"), vt = vTrack();
  if(v){ v.srcObject = vt ? new MediaStream([vt]) : null; v.style.opacity = vt ? 1 : 0; }
  $("ccam").textContent = vt ? "📹" : "🚫";
}
function refresh(){
  if(!inCall) return;
  const names = [name, ...Object.values(peers).map(p => p.name)];
  $("cname").textContent = "مكالمة جماعية";
  $("cstat").textContent = names.length > 1 ? names.join("، ") : "بانتظار انضمام الآخرين…";
  const turn = ICE.some(i => String(i.urls).includes("turn"));
  $("dbg").textContent = "TURN:" + (turn?"yes":"NO") + (iceNote ? " | "+iceNote : "") + " | " + Object.values(peers).map(p => p.name+":"+p.pc.iceConnectionState).join(" ");
}
async function joinCall(video){
  try{ local = await gum({audio:true, video: video ? VCON : false}); }
  catch(e){ if(!video) throw e; note("تعذّر تشغيل الكاميرا (" + e.name + ")، سنكمل بالصوت فقط"); local = await gum({audio:true}); }
  await loadIce(); inCall = true; ringing = null; show(false);
  const sv = tile("me", name); sv.muted = true; sv.style.transform = "scaleX(-1)"; setSelf();
  refresh(); sendSig({t:"join"});
}
function capVideo(s){
  try{ const pr = s.getParameters(); if(!pr.encodings || !pr.encodings.length) pr.encodings = [{}]; pr.encodings[0].maxBitrate = 350000; s.setParameters(pr).catch(()=>{}); }catch(e){}
}
function makePeer(id, pname){
  const pc = new RTCPeerConnection({iceServers:ICE}), p = peers[id] = {pc, name:pname, queue:[], stream:new MediaStream()};
  const v = tile(id, pname); v.srcObject = p.stream;
  pc.ontrack = e => {
    p.stream.addTrack(e.track);
    if(e.track.kind === "video"){
      const upd = () => { v.style.opacity = e.track.muted ? 0 : 1; };
      e.track.onmute = upd; e.track.onunmute = upd; upd();
    }
    v.play().catch(()=>{});
  };
  pc.onicecandidate = e => { if(e.candidate) sendSig({t:"ice",to:id,c:e.candidate}); };
  pc.oniceconnectionstatechange = () => {
    refresh();
    if(pc.iceConnectionState === "connected") pc.getTransceivers().forEach(t => { if(t.receiver.track.kind === "video") capVideo(t.sender); });
  };
  pc.onconnectionstatechange = () => { if(pc.connectionState==="failed"){ note("تعذّر الربط مع " + pname); dropPeer(id); } };
  refresh(); return p;
}
function dropPeer(id){
  const p = peers[id]; if(!p) return;
  try{ p.pc.close(); }catch(e){}
  const t = document.getElementById("t-"+id); if(t) t.remove();
  delete peers[id]; refresh();
}
async function offerTo(id, pname){
  if(peers[id]) return;
  const p = makePeer(id, pname), vt = vTrack();
  p.pc.addTransceiver(local.getAudioTracks()[0], {direction:"sendrecv"});
  if(vt) p.pc.addTransceiver(vt, {direction:"sendrecv"}); else p.pc.addTransceiver("video", {direction:"sendrecv"});
  const o = await p.pc.createOffer();
  await p.pc.setLocalDescription(o); sendSig({t:"offer",to:id,sdp:p.pc.localDescription});
}
async function flushIce(pe){
  for(const c of pe.queue) try{ await pe.pc.addIceCandidate(c); }catch(e){}
  pe.queue = [];
}
async function onSig(p){
  if(p.to && p.to!==uid) return;
  const id = p.from;
  if(p.t==="ring"){
    if(inCall || ringing) return;
    ringing = {from:id, name:p.name};
    $("cname").textContent = p.name; $("cstat").textContent = p.video ? "يدعوك لمكالمة فيديو 📹" : "يدعوك لمكالمة 📞"; $("dbg").textContent = "";
    show(true); notify(p.name, p.video ? "مكالمة فيديو 📹" : "يتصل بك 📞");
  } else if(p.t==="join" && inCall){
    sendSig({t:"hi",to:id});
    if(uid > id) await offerTo(id, p.name);
  } else if(p.t==="hi" && inCall){
    if(uid > id) await offerTo(id, p.name);
  } else if(p.t==="offer" && inCall){
    const pe = peers[id] || makePeer(id, p.name);
    await pe.pc.setRemoteDescription(p.sdp); await flushIce(pe);
    for(const t of pe.pc.getTransceivers()){
      const k = t.receiver.track.kind, tr = k === "audio" ? local.getAudioTracks()[0] : vTrack();
      t.direction = "sendrecv";
      if(tr) await t.sender.replaceTrack(tr);
    }
    const a = await pe.pc.createAnswer(); await pe.pc.setLocalDescription(a);
    sendSig({t:"answer",to:id,sdp:pe.pc.localDescription});
  } else if(p.t==="answer" && peers[id]){
    await peers[id].pc.setRemoteDescription(p.sdp); await flushIce(peers[id]);
  } else if(p.t==="ice" && peers[id]){
    const pe = peers[id];
    if(pe.pc.remoteDescription){ try{ await pe.pc.addIceCandidate(p.c); }catch(e){} } else pe.queue.push(p.c);
  } else if(p.t==="bye"){
    dropPeer(id);
    if(ringing && ringing.from===id && !inCall){ ringing = null; $("call").style.display = "none"; }
  }
}
async function startCall(video){
  if(inCall){ show(false); refresh(); return; }
  try{ await joinCall(video); sendSig({t:"ring",video:!!vTrack()}); post("call", vTrack() ? "video" : "call"); }
  catch(e){ note("تعذّر بدء المكالمة. تأكد من إذن المايكروفون"); leave(false); }
}
async function acceptCall(video){
  try{ await joinCall(video); }catch(e){ note("تعذّر الانضمام للمكالمة"); leave(false); }
}
function allVideoSenders(){
  const out = [];
  Object.values(peers).forEach(p => p.pc.getTransceivers().forEach(t => { if(t.receiver.track.kind === "video") out.push(t.sender); }));
  return out;
}
async function toggleCam(){
  const cur = vTrack();
  if(cur){
    cur.stop(); local.removeTrack(cur);
    await Promise.all(allVideoSenders().map(s => s.replaceTrack(null)));
  } else {
    try{
      const t = (await gum({video:VCON})).getVideoTracks()[0]; local.addTrack(t);
      await Promise.all(allVideoSenders().map(s => { capVideo(s); return s.replaceTrack(t); }));
    }catch(e){ note("تعذّر تشغيل الكاميرا (" + e.name + ")"); }
  }
  setSelf();
}
$("callBtn").onclick = () => startCall(false);
$("vidBtn").onclick = () => startCall(true);
$("cacc").onclick = () => acceptCall(false);
$("cvac").onclick = () => acceptCall(true);
$("ccam").onclick = toggleCam;
$("cmute").onclick = () => {
  muted = !muted; local && local.getAudioTracks().forEach(t => t.enabled = !muted);
  $("cmute").textContent = muted ? "🔇" : "🎤";
};
$("cend").onclick = () => { if(inCall) leave(true); else { ringing = null; $("call").style.display = "none"; } };
function leave(tell){
  if(tell && sig) sendSig({t:"bye"});
  Object.keys(peers).forEach(k => dropPeer(k));
  if(local) local.getTracks().forEach(t => t.stop());
  local = null; inCall = false; ringing = null; muted = false; $("cmute").textContent = "🎤";
  $("tiles").textContent = ""; $("dbg").textContent = ""; $("call").style.display = "none";
}
</script>
